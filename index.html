<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection File Structure demo</title>
    <link
        rel="icon"
        type="image/jpg"
        href="/assets/slappy.jpg"
    />
    <link rel="stylesheet" href="/css/index.css">



    <meta charset="UTF-8">
    <title>Title</title>

    <!--    Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0"
            crossorigin="anonymous"></script>

    <!--    Google jQuery-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="/public/js/userEditItems.js" defer></script>
    <script type="module" src="/index.js" defer></script>

    <script type="module">
        // Fetch data from the Node.js API
        fetch('/create-Container')
            .then((res) => res.json())
            .then((data) => {
                document.getElementById('app').textContent = data.message;
            });
        fetch('/create-Rock')
            .then((res) => res.json())
            .then((data) => {
                document.getElementById('app').textContent = data.message;
            });
        fetch('/api')
            .then((res) => res.json())
            .then((data) => {
                document.getElementById('app').textContent = data.message;
            });
    </script>


</head>
<body>
    <div id="grid" >
        <div class="column" id="col1">
            <div class="cell"><span></span>
                    <div id="selection_section">

                        <form id="createContainerForm" >
                            <div class="input-group mb-3">
                                <span class="input-group-text">Name:</span>
                                <input type="text" id="containerName" name="containerName" class="form-control" aria-describedby="inputGroup-sizing-default" required >
                            </div>
                            <div class="input-group mb-3 input-group-sm ">
                                <span class="input-group-text" >Ht</span>
                                <input type="number" min="0" step="1"
                                       id="containerHeight" name="containerHeight"
                                       class="form-control" placeholder="In"
                                       required
                                       aria-describedby="inputGroup-sizing-default">

                                <span class="input-group-text">Lt</span>
                                <input type="number" min="0" step="1"
                                       id="containerLength" name="containerLength"
                                       class="form-control" placeholder="In"
                                       required
                                       aria-describedby="inputGroup-sizing-default">

                                <span class="input-group-text">Wt</span>
                                <input type="number" min="0" step="1"
                                       id="containerWidth" name="containerWidth"
                                       class="form-control" placeholder="In"
                                       required
                                       aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
                            </div>
                            <button id="createContainerBtn" type="submit" class="btn btn-primary" style="width:100%;">Create Container</button>
                            <script type="module">
                                import {onCreateContainer} from '/index.js'

                                document.querySelector('#createContainerForm').addEventListener('submit', onCreateContainer)
                            </script>
                            <p id="errorTextContainer" style="color: red; opacity: 0;">cool text</p>
                        </form>


                        <form id="createRockForm">
                            <div class="input-group mb-3">
                                <span class="input-group-text">Mineral:</span>
                                <input type="text" id="rockMineral" class="form-control" aria-describedby="inputGroup-sizing-default" required>
                            </div>
                            <div class="input-group mb-3 input-group-sm ">
                                <span class="input-group-text" >Total wt:</span>
                                <input type="number" min="0" step="1"
                                       id="rockTotalWeight"
                                       class="form-control"
                                       placeholder="In"
                                       aria-describedby="inputGroup-sizing-default" required>

                                <span class="input-group-text">Amount:</span>
                                <input type="number" min="0" step="1"
                                       id="rockAmount"
                                       class="form-control"
                                       placeholder="In"
                                       aria-describedby="inputGroup-sizing-default" required>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">Processed:</span>
                                <select id="processess" name="processess">
                                    <option value="0">Rough</option>
                                    <option value="1">Tumbled</option>
                                    <option value="2">Polished</option>
                                    <option value="3">Faceted</option>
                                </select>
                                <input type="submit" id="rockProcessed" class="form-control" aria-describedby="inputGroup-sizing-default" required>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">URL:</span>
                                <input type="text" id="rockUrl" class="form-control" aria-describedby="inputGroup-sizing-default" required>
                            </div>
                            <button id="createObjectBtn" type="submit" class="btn btn-primary" style="width:100%;">Create Rock</button>
                            <script type="module">
                                import {onCreateRock} from '/index.js'

                                document.querySelector('#createRockForm').addEventListener('submit', onCreateRock)
                            </script>
                            <p id="errorTextObject" style="color: red; opacity: 0;">cool text</p>
                        </form>
                        <h5>Search</h5>
                        <!-- search box-->
                        <div class="input-group mb-3">
                            <input id="search_box" type="search" class="form-control" placeholder="Search cars..." aria-label="Search"
                                   aria-describedby="basic-addon2" onsearch="update_cars()">
                            <span class="input-group-text" id="basic-addon2"><i class="fas fa-search"></i></span>
                        </div>

                        <!-- like and dislike radio buttons-->
                        <div>
                            <h5>Filter</h5>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="like_dislikes" id="all_cars" value="all"
                                       onclick="update_cars(true,false,false)"
                                       checked>
                                <label class="form-check-label" for="all_cars">
                                    All cars
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="like_dislikes" id="all_likes" value="like"
                                       onclick="update_cars(false,true,false)">
                                <label class="form-check-label" for="all_likes">
                                    Likes
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="like_dislikes" id="all_dislikes" value="dislike"
                                       onclick="update_cars(false,false,true)">
                                <label class="form-check-label" for="all_dislikes">
                                    Dislikes
                                </label>
                            </div>
                        </div>

                        <!-- brand list-->
                        <div>
                            <h5>All brands</h5>
                            <div id = 'container' style=" height: 2000px; overflow: auto">
                                <ul id="item_section">
                                </ul>
                            </div>
                        </div>
                    </div>
            </div>
            <div class="resize-handle-x"></div>
        </div>

        <div class="column middle-column" id="col2" >
            <div class="cell">
                <span></span>
                <div class="resize-handle-y"></div>
            </div>
            <div class="cell" id="canvas-container">
                <div class="resize-handle-y"></div>
            </div>
        </div>
    </div>
<!--    <script type="module" src="/index.js"></script>-->
</body>
</html>
